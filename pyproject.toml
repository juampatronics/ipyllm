[project]
name = "ipyllm"
version = "0.1.0"
description = "Interact with LLM models from an IPython session"
readme = "README.md"
authors = [
    { name = "Juan Pablo de la Cruz Gutiérrez", email = "juampatronics@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.17.1",
    "llm>=0.36",
    "llm-ollama>=0.17.1",
    "mkdocs>=1.6.1",
]

[project.scripts]
ipyllm = "ipyllm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
